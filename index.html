<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ed Anisko</title>
  <meta name="description" content="Builder. Currently working on BuzzRAG, an AI-native news platform.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 480px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #fff;
    }

    .intro {
      font-size: 1.25rem;
      line-height: 1.6;
      color: #a3a3a3;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    a {
      color: #3b82f6;
      text-decoration: none;
      font-size: 1.1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s;
    }

    a:hover {
      color: #60a5fa;
    }

    .arrow {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ed Anisko</h1>
    <p class="intro">
      Builder. Currently working on BuzzRAG, an AI-native news platform that transforms YouTube videos into articles.
    </p>
    <div class="links">
      <a href="https://www.buzzrag.com/blog">
        Building in Public <span class="arrow">&rarr;</span>
      </a>
      <a href="https://www.buzzrag.com">
        BuzzRAG <span class="arrow">&rarr;</span>
      </a>
      <a href="https://twitter.com/edanisko">
        Twitter <span class="arrow">&rarr;</span>
      </a>
    </div>
  </div>
</body>
</html>
